kind = "web"
previewPath = "/"
title = "AI Lesson Planner"
version = "1.0.0"
id = "artifacts/lesson-planner"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24954

[services.development]
run = "pnpm --filter @workspace/lesson-planner run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lesson-planner", "run", "build" ]
serve = "static"
publicDir = "artifacts/lesson-planner/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24954"
BASE_PATH = "/"
